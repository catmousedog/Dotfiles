# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colors ($base, $text, $mauveAlpha, ...) generated by ~/.local/bin/theme
source = ~/.local/state/theme/current/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    path = ~/.config/backgrounds/background.png
    blur_passes = 3
    brightness = 0.6
}

label {
    text = $TIME
    color = $text
    font_size = 90
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 55
    outline_thickness = 3
    rounding = 20
    outer_color = $mauve
    inner_color = $base
    font_color = $text
    check_color = $blue
    fail_color = $red
    placeholder_text = password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
