# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colors ($bg, $fg, $accentAlpha, ...) generated by ~/.local/bin/theme
source = ~/.local/state/theme/current/hyprlock.conf

$font = Noto Sans Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

# the current wallpaper (linked by `theme`), blurred and dimmed; plain $bg without one
background {
    path = ~/.local/state/theme/current/wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.17
}

# clock
label {
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 150
    halign = center
    valign = center
}

# date
label {
    text = cmd[update:60000] date +"%A %d %B"
    color = $accent
    font_size = 20
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 3
    position = 0, 50
    halign = center
    valign = center
}

# same look as the bar: pill with the accent gradient as border
input-field {
    size = 320, 52
    outline_thickness = 3
    rounding = -1
    outer_color = rgba($accent2Alphaee) rgba($accentAlphaee) 0deg
    inner_color = rgba($bgAlphadd)
    font_color = $fg
    font_family = $font Bold
    check_color = $yellow
    fail_color = $red
    capslock_color = $orange
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
    shadow_size = 3
    position = 0, -50
    halign = center
    valign = center
}

# battery
label {
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $subtle
    font_size = 13
    font_family = $font Bold
    position = 0, 30
    halign = center
    valign = bottom
}
