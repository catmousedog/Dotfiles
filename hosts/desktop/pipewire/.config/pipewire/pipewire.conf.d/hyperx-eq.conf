# Equalizer for the wired HyperX Cloud III (USB).
#
# Adds an output "HyperX (EQ)": set it as the default output. It applies the
# filters below and plays the result on the real headset (keep that one at
# 100%, use this output's volume). Quickshell hides the raw headset output.
#
# Tuning: make the Cloud III sound like a Razer Kraken 7.1 V2. Fitted to the
# difference between Rtings' measurements of the HyperX Cloud III and the Razer
# Kraken Pro V2 (same drivers as the 7.1 V2), both on the HMS II.3 rig, from
# AutoEQ: https://github.com/jaakkopasanen/AutoEq/tree/master/results/Rtings/HMS%20II.3%20over-ear
# Plus a sub-bass shelf on top (picked by ear over a few alternatives).
#
# "preamp" sets the overall level: more negative = quieter, more headroom for bass.
# -3 makes 100% on the volume slider very loud (like other outputs); the
# limiter below catches the bass peaks that this leaves no headroom for.
# Apply changes: systemctl --user restart pipewire (then restart Firefox).

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "HyperX (EQ)"
            media.name       = "HyperX (EQ)"
            filter.graph = {
                nodes = [
                    {   type  = builtin
                        name  = eq
                        label = param_eq
                        config = {
                            filters = [
                                # preamp (a high shelf at 0 Hz lowers everything)
                                { type = bq_highshelf freq = 0     gain = -3.0  q = 1.0  }
                                # Kraken warmth: broad bass boost, ~40-400 Hz
                                { type = bq_peaking   freq = 141   gain = 11.0  q = 0.38 }
                                # extra sub-bass / rumble below ~60 Hz
                                { type = bq_lowshelf  freq = 60    gain = 6.0   q = 0.70 }
                                # less upper-mid "thinness"
                                { type = bq_peaking   freq = 1655  gain = -5.6  q = 1.48 }
                                # tame treble sharpness
                                { type = bq_peaking   freq = 6580  gain = -6.0  q = 2.00 }
                                # a little air
                                { type = bq_peaking   freq = 13357 gain = 3.4   q = 0.31 }
                            ]
                        }
                    }
                    # Clipping guard only, not a volume cap: catches peaks the bass
                    # boost would push past full scale (which would distort). It is
                    # inactive the rest of the time. th is a gain: 0.891 = -1 dBFS,
                    # 0.178 = -15 (an audible cap: pumps on bass), 1 = no limit.
                    # Needs lsp-plugins-lv2.
                    {   type   = lv2
                        name   = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            th    = 0.891
                            # don't raise quiet sound up to the ceiling
                            boost = 0
                        }
                    }
                ]
                links = [
                    { output = "eq:Out 1" input = "limiter:in_l" }
                    { output = "eq:Out 2" input = "limiter:in_r" }
                ]
                inputs  = [ "eq:In 1" "eq:In 2" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.hyperx_eq"
                media.class = Audio/Sink
                device.form-factor = headset
            }
            playback.props = {
                node.name   = "effect_output.hyperx_eq"
                node.passive = true
                target.object = "alsa_output.usb-HP__Inc_HyperX_Cloud_III_0000000000-00.analog-stereo"            }
        }
    }
]
