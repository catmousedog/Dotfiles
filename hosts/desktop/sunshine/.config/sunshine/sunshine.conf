# https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2configuration.html
# Sunshine's web UI (https://localhost:47990) rewrites this file when you save there.

# Wayland capture: the only one that sees the virtual monitor `stream` creates
capture = wlr

# Runs for every app: virtual monitor on connect, real monitor back on disconnect
global_prep_cmd = [{"do":"sh -c \"~/.local/bin/stream start\"","undo":"sh -c \"~/.local/bin/stream stop\""}]
