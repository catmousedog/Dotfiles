# Only the differences from yazi's default keymap; the defaults stay up to date
# with yazi itself. Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml
# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
	{ on = "q",     run = "quit --no-cwd-file",   desc = "Quit without outputting cwd-file" },
	{ on = "<C-q>", run = "quit",                 desc = "Quit the process" },
	{ on = "h",     run = "back",                 desc = "Back to previous directory" },
	{ on = "l",     run = "forward",              desc = "Forward to next directory" },
	{ on = "t",     run = "tab_create --current", desc = "Create a new tab with CWD" },
]
