# Only what differs from spotify-player's defaults.

# Generated by `theme` into theme.toml (not in the repo): the terminal's colors, so it
# follows kitty live. The progress bar's accent color needs the launcher's kitty window.
theme = "desktop"

# My own app on https://developer.spotify.com/dashboard (redirect URI
# http://127.0.0.1:8989/login). The built-in id is shared by every user of
# spotify-player and is rate limited to the point of being unusable.
client_id = "7883cc0171784c0c93cee37db289edfb"
# By default playlist requests go through ncspot's (also shared) id; use mine.
ncspot_only_get_endpoints = []

[device]
# Keep played songs in ~/.cache/spotify-player/audio: faster seeking and replays.
audio_cache = true
