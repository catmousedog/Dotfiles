# generated by ~/.local/bin/theme
include ~/.local/state/theme/current/kitty.conf
font_family CaskaydiaCove Nerd Font Mono
# font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

# machine specific overrides, from hosts/<host>/kitty (optional)
globinclude host.conf
